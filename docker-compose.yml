services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudbridge
      POSTGRES_PASSWORD: cloudbridge_secret
      POSTGRES_DB: cloudbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudbridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Next.js Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudbridge-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
